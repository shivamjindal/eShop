# Configure which branches trigger builds
trigger:
  batch: true
  branches:
    include:
      - main

variables:
  - name: TeamName
    value: dotnet-aspire

resources:
  repositories:
    # Repo: 1ESPipelineTemplates/1ESPipelineTemplates
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      policheck:
        enabled: true
      tsa:
        enabled: true
    pool:
      name: NetCore1ESPool-Svc-Internal
      image: windows.vs2019.amd64
      os: windows
    stages:
      - stage: buildStage
        displayName: Build Stage
        jobs:
          - job: Build
            displayName: Windows Build
            timeoutInMinutes: 90
            workspace:
              clean: all
            steps:
              - task: UseDotNet@2
                inputs:
                  useGlobalJson: true
              - powershell: |
                  Invoke-WebRequest -UseBasicParsing -Uri 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile rustup-init.exe
                  .\rustup-init.exe -y --default-toolchain stable
                  Write-Host "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
                displayName: Install Rust
              - script: dotnet build eShop.Web.slnf
                displayName: Build Step
