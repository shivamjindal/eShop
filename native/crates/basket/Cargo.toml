[package]
name = "basket"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "eShop Basket service (migrated from src/Basket.API)"
repository.workspace = true

[lib]
name = "basket"
path = "src/lib.rs"

[[bin]]
name = "basket-service"
path = "src/bin/basket-service.rs"

[[bin]]
name = "basket-parity"
path = "src/bin/basket-parity.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
lapin = "4.10.0"
prost = "0.14.4"
redis = { version = "1.5.0", features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "webpki-roots", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
