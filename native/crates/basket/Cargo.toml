[package]
name = "basket"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "eShop basket service (migrated from src/Basket.API)"
repository.workspace = true

[lib]
name = "basket"
path = "src/lib.rs"

[[bin]]
name = "basket-service"
path = "src/bin/basket_service.rs"

[[bin]]
name = "basket-parity"
path = "src/bin/basket_parity.rs"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
lapin = "4.10.0"
prost = "0.14.4"
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
