[package]
name = "basket_service"
version = "0.1.0"
edition = "2021"
description = "eShop Basket service (gRPC + Redis + RabbitMQ) — Rust port of src/Basket.API"
license = "MIT"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "basket-service"
path = "src/bin/basket_service.rs"

[[bin]]
name = "parity-client"
path = "src/bin/parity_client.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
futures-lite = "2.6"
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
lapin = "2.5"
prost = "0.14"
redis = { version = "1.5", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3.2"
tonic-prost-build = "0.14"
